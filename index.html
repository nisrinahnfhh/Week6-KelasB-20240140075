<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPAW Week 6 - Katalog Produk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <section id="produk">
      <div class="catalog-header">
        <div>
          <h1>Katalog Produk</h1>
          <p class="subtitle">Data diambil menggunakan Fetch API dari DummyJSON.</p>
          <a href="caption.html" class="link-small">Buka Caption Generator &rarr;</a>
        </div>

        <div class="toolbar">
          <input type="search" id="search-input" placeholder="Cari nama produk...">
          <select id="category-select">
            <option value="">Semua Kategori</option>
          </select>
          <button type="button" id="reload-btn" class="btn-light">Muat Ulang</button>
        </div>
      </div>

      <p id="result-info" class="result-info"></p>

      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span>Memuat data produk...</span>
      </div>

      <div id="error" class="error hidden">
        <p id="error-message"></p>
        <button id="retry-btn" type="button">Coba Lagi</button>
      </div>

      <div id="empty" class="empty hidden">Produk tidak ditemukan.</div>

      <div id="product-list" class="product-grid"></div>
    </section>
  </main>

  <footer>
    <p>Nisrina Hanifah Ramadhani &bull; 20240140075 &bull; UMY</p>
  </footer>

  <script src="js/products.js"></script>
</body>
</html>
